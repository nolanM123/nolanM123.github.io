name: CI/CD Pipeline

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  # Job 1: Check code quality
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Lint Code
        run: npm run lint
      - name: Type-Check TypeScript
        run: npx tsc --noEmit

  # Job 2: Build and deploy (Only runs if validate passes)
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Fix Routing
        run: cp dist/index.html dist/404.html
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
